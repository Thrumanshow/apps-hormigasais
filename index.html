<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HormigasAIS Edge App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="theme-color" content="#00ff66">
  <style>
    body { font-family: monospace; background: #0a0a0a; color: #00ff66; padding: 20px; margin: 0; }
    .card { border: 1px solid #00ff66; padding: 15px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
    button { background: #00ff66; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .status { margin-top: 10px; font-size: 0.9em; word-break: break-word; }
    input { padding: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🐜 HormigasAIS Edge App</h2>
    <p>Conectado a Nodo Soberano vía LBH</p>

    <label>Lectura Telemetría / Control:</label><br><br>
    <input type="number" id="sensorVal" value="600">
    <button onclick="sendLBHFrame()">Enviar Trama LBH</button>

    <div class="status" id="log">Estado: Esperando acción...</div>
    <br>
    <button id="btnInstall" style="display:none; background:#ffaa00;">📱 Instalar App en Pantalla</button>
  </div>

  <script>
    let ws;
    function connect() {
      ws = new WebSocket("ws://" + location.hostname + ":8765");
      ws.binaryType = "arraybuffer";
      ws.onopen = () => updateLog("🟢 Conectado al Nodo Edge");
      ws.onclose = () => updateLog("🔴 Desconectado del Nodo Edge");
      ws.onerror = () => updateLog("⚠️ Error de conexión con el Nodo Edge");

      ws.onmessage = (event) => {
        let view = new DataView(event.data);
        let magic = String.fromCharCode(view.getUint8(0), view.getUint8(1));
        let flags = view.getUint8(3);
        let payload = view.getUint32(8);

        if (magic === "LA") {
          let estado = flags === 1 ? "⚠️ ALERTA AGENTE" : "✅ NORMAL";
          updateLog(`📩 Respuesta LBH | Estado: ${estado} | Val: ${payload}`);
        }
      };
    }

    function sendLBHFrame() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        updateLog("⚠️ No hay conexión activa con el Nodo Edge");
        return;
      }
      let buffer = new ArrayBuffer(16);
      let view = new DataView(buffer);
      let val = parseInt(document.getElementById("sensorVal").value) || 0;

      view.setUint8(0, 0x4C);  // 'L'
      view.setUint8(1, 0x41);  // 'A'
      view.setUint8(2, 0x01);  // Tipo: Comando/Data
      view.setUint8(3, 0x00);  // Flags
      view.setUint32(4, 1001); // Sensor/Device ID
      view.setUint32(8, val);  // Payload
      view.setUint32(12, Math.floor(Date.now() / 1000)); // Timestamp

      ws.send(buffer);
      updateLog("📤 Trama LBH (16 Bytes) enviada al Borde...");
    }

    function updateLog(msg) {
      document.getElementById("log").innerText = msg;
    }

    connect();

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      let btn = document.getElementById('btnInstall');
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        deferredPrompt.prompt();
      });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
